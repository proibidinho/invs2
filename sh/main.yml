  #           episode_id: '{{ event.payload.episodeId }}'

  - name: Disco /var acima de 85% em Campinas
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/var$", ignorecase=true) and
      (
        event.payload.entityLocation is search("CAMPINAS", ignorecase=true) or
        event.payload.entityLocation is search("OCI-NM-NM", ignorecase=true)
      )
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Limpeza /var - Campinas"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: '{{ event.payload.episodeId }}'


  - name: Disco /var acima de 85% em Mackenzie
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/var$", ignorecase=true) and
      event.payload.entityLocation is search("MACKENZIE", ignorecase=true)
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Limpeza /var - Mackenzie"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: '{{ event.payload.episodeId }}'


  - name: Disco /opt/agent nos servidores Brux2334 e Brux2335 em Campinas
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/opt/agent$", ignorecase=true) and
      event.payload.entityLocation is search("CAMPINAS", ignorecase=true) and
      (
        event.payload.entityName is search("BRUX233[45]", ignorecase=true) or
        event.payload.entityIC   is search("BRUX233[45]", ignorecase=true) or
        event.payload.entityIC   is search("172\\.30\\.56\\.10[23]", ignorecase=true)
      )
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Limpeza /opt/agent - Campinas"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: '{{ event.payload.episodeId }}'


  # =========================================================================
  # NOVA RULE - Modelo Self-Healing com Instance Group dinamico (unico JT)
  #
  # Esta rule apenas DISPARA o Workflow. Ela NAO decide qual datacenter
  # utilizar (toda a inteligencia fica no Job Template "Seleciona Instance
  # Group"). Apenas repassa os extra_vars abaixo.
  #
  # Fluxo: Splunk -> Rulebook -> Workflow
  #        (Seleciona Instance Group -> Notifica Disco -> Devolve Splunk)
  #
  # O fallback fica no Workflow, nao no Rulebook.
  # =========================================================================
  - name: Disco /home cheio (Linux) - Notifica Disco (Instance Group dinamico)
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/home", ignorecase=true)
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Notifica Disco /home"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            server: "{{ event.payload.entityIC }}"
            location: "{{ event.payload.entityLocation }}"
            filesystem: "{{ event.payload.diskPath }}"
            alert_name: "{{ event.payload.alertTitle }}"
            entityName: "{{ event.payload.entityName }}"
            episode_id: "{{ event.payload.episodeId | default('N/A') }}"


