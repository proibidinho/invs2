  - name: Tenable Agent (Linux) indisponível - Lapa
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.entityLocation is search("LAPA", ignorecase=true) and
      (
        event.payload.alertTitle  is search("tenable|nessus", ignorecase=true) or
        event.payload.entityName  is search("tenable|nessus", ignorecase=true)
      )
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Restart Tenable Linux - Lapa"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: "{{ event.payload.episodeId | default('N/A') }}"

