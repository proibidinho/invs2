        event.payload.entityName is search("BRUX233[45]", ignorecase=true) or
        event.payload.entityIC   is search("BRUX233[45]", ignorecase=true) or
        event.payload.entityIC   is search("172\\.30\\.56\\.10[23]", ignorecase=true)
