  #---- GUARDICORE (gc-agent) ------------------------------------------------

  - name: Guardicore (Linux) indisponível - Lapa
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.entityLocation is search("LAPA", ignorecase=true) and
      (
        event.payload.alertTitle  is search("guardicore|gc[-_]agent", ignorecase=true) or
