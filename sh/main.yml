            episode_id: "{{ event.payload.episodeId | default('N/A') }}"


  #---- FALLBACKS -------------

  - name: Fallback - Agentes SI (Linux) fora dos sites mapeados
    condition: |
      event.payload.entityOS == "LINUX" and
      (
        event.payload.alertTitle  is search("tenable|nessus|crowdstrike|falcon|guardicore|gc[-_]agent", ignorecase=true) or
        event.payload.entityName  is search("tenable|nessus|crowdstrike|falcon|guardicore|gc[-_]agent", ignorecase=true)
      ) and
      not (
        event.payload.entityLocation is search("LAPA", ignorecase=true) or
        event.payload.entityLocation is search("CAMPINAS", ignorecase=true) or
        event.payload.entityLocation is search("OCI-NM-NM", ignorecase=true) or
        event.payload.entityLocation is search("MACKENZIE", ignorecase=true)
      )
    action:
      run_job_template:
        name: "fallback-splunk"
        organization: "ORG-CLBR-TI-OPS-IT-SERVICE-AUTOMATION"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            system: "{{ event.payload.entityOS }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: "{{ event.payload.episodeId | default('N/A') }}"


  - name: Fallback - Linux /var fora dos sites mapeados
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/var$", ignorecase=true) and
      not (
        event.payload.entityLocation is search("LAPA", ignorecase=true) or
        event.payload.entityLocation is search("CAMPINAS", ignorecase=true) or
        event.payload.entityLocation is search("OCI-NM-NM", ignorecase=true) or
