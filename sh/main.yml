- name: Disco cheio (Linux)
  hosts: EDA
  sources:
  - ansible.eda.webhook:
      host: 0.0.0.0
      port: 5001

  rules:

  - name: Disco /var acima de 85% em Lapa
    condition: |
      event.payload.entityOS == "LINUX" and
      event.payload.diskPath is search("^/var$", ignorecase=true) and
      event.payload.entityLocation is search("LAPA", ignorecase=true)
    action:
      run_workflow_template:
        name: "[WORKFLOW] - Limpeza /var - Lapa"
        organization: "ORG-CLBR-TI-INFRA-SUPORTE-UNIX"
        job_args:
          extra_vars:
            alert_name: "{{ event.payload.alertTitle }}"
            name: "{{ event.payload.entityName }}"
            location: "{{ event.payload.entityLocation }}"
            server: "{{ event.payload.entityIC }}"
            episode_id: '{{ event.payload.episodeId }}' 

  # - name: Disco /var acima de 85% em Campinas
