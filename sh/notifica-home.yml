---
- name: Iniciando fluxo de notificacao de disco
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Mostrar parametros recebidos
      ansible.builtin.debug:
        msg:
          - "Host: {{ name | default('N/A') }}"
          - "Filesystem: {{ filesystem | default('N/A') }}"

    - name: Extrair host e IPs
      ansible.builtin.set_fact:
        host_clean: "{{ name.split('|')[0] | trim }}"
        ips_list: "{{ name | regex_findall('\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b') }}"

    - name: Testar SSH
      ansible.builtin.shell: |
        timeout 60 ssh \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=no \
        -o ConnectTimeout=3 \
        -o ConnectionAttempts=2 \
        {{ item }} "echo OK"
      register: ssh_check
      ignore_errors: true
      changed_when: false
      loop: "{{ [host_clean] + ips_list }}"

    - name: Selecionar primeiro host acessivel
      ansible.builtin.set_fact:
        target_name: >-
          {% set success = ssh_check.results
             | selectattr('rc','equalto',0)
             | map(attribute='item')
             | list %}
          {{ success[0] if success | length > 0 else '' }}

    - name: Validar acesso SSH
      ansible.builtin.assert:
        that:
          - target_name | trim | length > 0
        fail_msg: "Nenhum host acessivel por SSH."

    - name: Adicionar host ao inventario temporario
      ansible.builtin.add_host:
        name: "{{ target_name }}"
        groups: Linux

  rescue:

    - name: Reportar falha
      ansible.builtin.set_stats:
        data:
          resultado_do_primeiro_job: "{{ tower_job_id | default('N/A') }}"
          tipo_selfhealing: "disco"
          nome_servico: "{{ filesystem | default('/home') }}"
          metrica_antes: "N/A"
          metrica_depois: "ERRO_SSH"
          metrica_esperada: "<=90"

    - name: Falhar playbook
      ansible.builtin.fail:
        msg: "Falha na conexao SSH."

- name: Analisar diretorio e notificar responsavel
  hosts: Linux
  gather_facts: false

  roles:
    - home_full_notify