# =============================================================================
# Playbook: Sincronizacao Azure (via AAP) -> Jira Assets (CMDB)
# =============================================================================
# Uso:
#   ansible-playbook playbooks/sync_azure_cmdb.yml -e "sync_mode=full"
#   ansible-playbook playbooks/sync_azure_cmdb.yml -e "dry_run=true"
# =============================================================================
---
- name: Sincronizacao Azure (via AAP) -> Jira Assets CMDB
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Incluir variaveis do role
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/integration_assets_azure/vars/main.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_azure/vars/modelo_servidor_map_azure.yml"

    - name: Definir modo de sincronizacao
      ansible.builtin.set_fact:
        _sync_mode: "{{ sync_mode | default('full') }}"
        _enable_deactivation: "{{ enable_deactivation | default(false) }}"
        _dry_run: "{{ dry_run | default(false) | bool }}"

    - name: Verificar credenciais Jira
      ansible.builtin.assert:
        that:
          - jira_user is defined and jira_user | length > 0
          - jira_password is defined and jira_password | length > 0
        fail_msg: "Defina JIRA_USER e JIRA_PASSWORD"

    - name: Exibir configuracao
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "          SINCRONIZACAO AZURE (AAP) -> JIRA ASSETS (CMDB)"
          - "════════════════════════════════════════════════════════════════"
          - "AAP Host: {{ aap_host }}"
          - "Inventario ID: {{ aap_inventory_id }}"
          - "Modo: {{ _sync_mode }} | Dry Run: {{ _dry_run }}"
          - "Modelos mapeados: {{ modelo_servidor_map | length }}"
          - "VM Specs mapeados: {{ azure_vm_specs | length }}"
          - "════════════════════════════════════════════════════════════════"

  roles:
    - role: integration_assets_azure
      vars:
        sync_mode: "{{ _sync_mode }}"
        enable_deactivation: "{{ _enable_deactivation }}"
        dry_run: "{{ _dry_run }}"
        modelo_servidor_map: "{{ modelo_servidor_map }}"
        azure_vm_specs: "{{ azure_vm_specs }}"
        owner_ids: "{{ owner_ids }}"