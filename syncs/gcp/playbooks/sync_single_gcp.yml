# =============================================================================
# Playbook: Testar sincronizacao GCP com servidores selecionados
# =============================================================================
# COMO USAR:
#   1. Por LISTA:
#      ansible-playbook playbooks/sync_single_gcp.yml \
#        -e 'test_servers=["apigee-mig-prod-us-east-4-h29c"]'
#
#   2. Por LIMITE:
#      ansible-playbook playbooks/sync_single_gcp.yml -e "test_limit=3"
#
#   3. DRY RUN:
#      ansible-playbook playbooks/sync_single_gcp.yml -e "test_limit=5" -e "dry_run=true"
# =============================================================================
---
- name: Testar sincronizacao GCP com servidores selecionados
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    test_servers: []
    test_limit: 0
    dry_run: false

  pre_tasks:
    - name: Incluir variaveis do role
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/main.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/mapeamento_gcp_cmdb.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/modelo_servidor_map_gcp.yml"

    - name: Verificar credenciais Jira
      ansible.builtin.assert:
        that:
          - jira_user is defined and jira_user | length > 0
          - jira_password is defined and jira_password | length > 0
        fail_msg: "Defina JIRA_USER e JIRA_PASSWORD"

    - name: Verificar parametros
      ansible.builtin.assert:
        that:
          - test_servers | length > 0 or test_limit | int > 0
        fail_msg: "Defina test_servers (lista) ou test_limit (numero)"

    - name: Exibir configuracao
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "          TESTE: SINCRONIZACAO GCP → JIRA ASSETS"
          - "════════════════════════════════════════════════════════════════"
          - "Servidores: {{ test_servers if test_servers | length > 0 else 'primeiros ' ~ test_limit }}"
          - "Dry Run: {{ dry_run }}"
          - "Modelos: {{ modelo_servidor_map | length }} | Specs: {{ gcp_machine_specs | length }}"
          - "════════════════════════════════════════════════════════════════"

  tasks:
    # -------------------------------------------------------------------------
    # AAP
    # -------------------------------------------------------------------------
    - name: Buscar hosts do AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/inventories/{{ aap_inventory_id }}/hosts/?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_verify_ssl | default(false) }}"
        return_content: yes
      register: aap_hosts
      environment: "{{ proxy_env | default({}) }}"

    - name: Buscar variables de cada host
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/hosts/{{ item.id }}/variable_data/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_verify_ssl | default(false) }}"
      register: host_vars_results
      loop: "{{ aap_hosts.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Consolidar variables
      ansible.builtin.set_fact:
        all_host_vars: "{{ host_vars_results.results | map(attribute='json') | list }}"

    - name: Transformar todos os hosts (batch)
      ansible.builtin.set_fact:
        all_cloud_data: >-
          {{ all_host_vars | batch_transform_gcp_hosts(
               modelo_servidor_map | default({}),
               gcp_machine_specs   | default({}),
               owner_ids           | default({}),
               cpu_platform_map    | default({})
             ) }}

    - name: "Log - hosts ignorados (GKE + sem ef_cmdb)"
      ansible.builtin.debug:
        msg: "Hosts AAP: {{ all_host_vars | length }} | Elegiveis: {{ all_cloud_data | length }} | Ignorados: {{ all_host_vars | length - all_cloud_data | length }}"

    # -------------------------------------------------------------------------
    # SELECAO DOS SERVIDORES DE TESTE
    # -------------------------------------------------------------------------
    - name: Selecionar por lista de nomes
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data | selectattr('name_cloud', 'in', test_servers) | list }}"
      when: test_servers | length > 0

    - name: Selecionar por limite
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data[:test_limit | int] }}"
      when: test_limit | int > 0 and test_servers | length == 0

    - name: Exibir cloud_data de cada servidor
      ansible.builtin.debug:
        msg: "{{ item | to_nice_yaml }}"
      loop: "{{ selected_servers }}"
      loop_control:
        label: "{{ item.name_cloud }}"

    - name: Parar se dry_run
      ansible.builtin.meta: end_play
      when: dry_run | bool

    # =========================================================================
    # EXECUCAO REAL
    # =========================================================================
    - name: Inicializar logs
      ansible.builtin.set_fact:
        sync_log_create: []
        sync_log_skip: []
        sync_log_errors: []

    # -------------------------------------------------------------------------
    # CMDB - BUSCA DIRECIONADA PELOS Names SELECIONADOS
    #
    # Nao carregamos os 20.000+ objetos do CMDB.
    # Consultamos somente os Names dos servidores selecionados neste teste,
    # em lotes de 200.
    #
    # A busca e GLOBAL no Object Type 121, sem filtro de Datacenter,
    # para impedir CREATE quando o mesmo Name ja existir em qualquer origem.
    # -------------------------------------------------------------------------
    - name: Extrair Names selecionados para consulta no CMDB
      ansible.builtin.set_fact:
        cloud_server_names: >-
          {{
            selected_servers
            | map(attribute='name_cloud')
            | unique
            | list
          }}

    - name: Dividir Names em lotes de 200
      ansible.builtin.set_fact:
        cloud_server_name_batches: "{{ cloud_server_names | batch(200) | map('list') | list }}"

    - name: Buscar no CMDB somente os Names selecionados
      ansible.builtin.uri:
        url: "{{ jira_url }}/object/aql?startAt=0&maxResults=200"
        method: POST
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        force_basic_auth: yes
        user: "{{ jira_user }}"
        password: "{{ jira_password }}"
        body:
          qlQuery: 'objectTypeId = 121 AND Name IN ({{ item | map("to_json") | join(", ") }})'
        body_format: json
        status_code: [200]
        timeout: 60
      register: cmdb_name_batches_result
      environment: "{{ proxy_env | default({}) }}"
      loop: "{{ cloud_server_name_batches }}"
      loop_control:
        label: "Lote com {{ item | length }} Names"
      retries: 3
      delay: 5
      until: cmdb_name_batches_result.status == 200
      when: item | length > 0

    - name: Inicializar lista de Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: []

    - name: Consolidar Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: >-
          {{
            cmdb_server_names
            + (item.json['values'] | default([]) | map(attribute='label') | list)
          }}
      loop: "{{ cmdb_name_batches_result.results | default([]) }}"
      loop_control:
        label: "{{ item.json['values'] | default([]) | length }} Names encontrados"
      when:
        - not (item.skipped | default(false))
        - item.json is defined

    - name: Normalizar lista de Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: "{{ cmdb_server_names | unique | list }}"

    - name: Debug - Consulta direcionada por Name
      ansible.builtin.debug:
        msg:
          - "Names consultados: {{ cloud_server_names | length }}"
          - "Lotes AQL: {{ cloud_server_name_batches | length }}"
          - "Names ja existentes no CMDB: {{ cmdb_server_names | length }}"

    # -------------------------------------------------------------------------
    # DETERMINAR CREATE / SKIP
    # -------------------------------------------------------------------------
    - name: Separar servidores a criar e existentes
      ansible.builtin.set_fact:
        servers_to_create: >-
          {{
            selected_servers
            | rejectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}
        servers_to_skip: >-
          {{
            selected_servers
            | selectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}

    - name: Resumo das acoes
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "A CRIAR: {{ servers_to_create | length }}"
          - "{% for s in servers_to_create %}- {{ s.name_cloud }}\n{% endfor %}"
          - "EXISTENTES (skip): {{ servers_to_skip | length }}"
          - "{% for s in servers_to_skip %}- {{ s.name_cloud }}\n{% endfor %}"
          - "════════════════════════════════════════════════════════════════"

    # -------------------------------------------------------------------------
    # CREATE
    # -------------------------------------------------------------------------
    - name: Criar servidores
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/integration_assets_gcp/tasks/create.yml"
      vars:
        current_cloud_data: "{{ item }}"
      loop: "{{ servers_to_create }}"
      loop_control:
        label: "{{ item.name_cloud }}"
      when: servers_to_create | length > 0

    # -------------------------------------------------------------------------
    # SKIP
    # -------------------------------------------------------------------------
    - name: Registrar servidores existentes (skip)
      ansible.builtin.set_fact:
        sync_log_skip: "{{ sync_log_skip + [item.name_cloud] }}"
      loop: "{{ servers_to_skip }}"
      loop_control:
        label: "{{ item.name_cloud }}"
      when: servers_to_skip | length > 0

    # -------------------------------------------------------------------------
    # RESULTADO FINAL
    # -------------------------------------------------------------------------
    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                    RESULTADO DO TESTE"
          - "════════════════════════════════════════════════════════════════"
          - "Selecionados: {{ selected_servers | length }}"
          - "Criados: {{ sync_log_create | length }}"
          - "Existentes (skip): {{ sync_log_skip | length }}"
          - "Erros: {{ sync_log_errors | length }}"
          - "════════════════════════════════════════════════════════════════"

    - name: Exibir erros da sincronizacao
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ item.name | default('N/A') }}"
          - "Status: {{ item.status | default('N/A') }}"
          - "Erro: {{ item.msg | default('Erro sem mensagem') }}"
      loop: "{{ sync_log_errors }}"
      loop_control:
        label: "{{ item.name | default('N/A') }}"
      when: sync_log_errors | length > 0