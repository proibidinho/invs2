# =============================================================================
# Playbook: Testar sincronizacao GCP com servidores selecionados
# =============================================================================
# COMO USAR:
#   1. Por LISTA:
#      ansible-playbook playbooks/sync_single_gcp.yml \
#        -e 'test_servers=["apigee-mig-prod-us-east-4-h29c"]'
#
#   2. Por LIMITE:
#      ansible-playbook playbooks/sync_single_gcp.yml -e "test_limit=3"
#
#   3. DRY RUN:
#      ansible-playbook playbooks/sync_single_gcp.yml -e "test_limit=5" -e "dry_run=true"
# =============================================================================
---
- name: Testar sincronizacao GCP com servidores selecionados
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    test_servers: []
    test_limit: 0
    dry_run: false

  pre_tasks:
    - name: Incluir variaveis do role
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/main.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/mapeamento_gcp_cmdb.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_gcp/vars/modelo_servidor_map_gcp.yml"

    - name: Verificar credenciais Jira
      ansible.builtin.assert:
        that:
          - jira_user is defined and jira_user | length > 0
          - jira_password is defined and jira_password | length > 0
        fail_msg: "Defina JIRA_USER e JIRA_PASSWORD"

    - name: Verificar parametros
      ansible.builtin.assert:
        that:
          - test_servers | length > 0 or test_limit | int > 0
        fail_msg: "Defina test_servers (lista) ou test_limit (numero)"

    - name: Exibir configuracao
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "          TESTE: SINCRONIZACAO GCP → JIRA ASSETS"
          - "════════════════════════════════════════════════════════════════"
          - "Servidores: {{ test_servers if test_servers | length > 0 else 'primeiros ' ~ test_limit }}"
          - "Dry Run: {{ dry_run }}"
          - "Modelos: {{ modelo_servidor_map | length }} | Specs: {{ gcp_machine_specs | length }}"
          - "════════════════════════════════════════════════════════════════"

  tasks:
    # -------------------------------------------------------------------------
    # AAP
    # -------------------------------------------------------------------------
    - name: Buscar hosts do AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/inventories/{{ aap_inventory_id }}/hosts/?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_verify_ssl | default(false) }}"
        return_content: yes
      register: aap_hosts
      environment: "{{ proxy_env | default({}) }}"

    - name: Buscar variables de cada host
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/hosts/{{ item.id }}/variable_data/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_verify_ssl | default(false) }}"
      register: host_vars_results
      loop: "{{ aap_hosts.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Consolidar variables
      ansible.builtin.set_fact:
        all_host_vars: "{{ host_vars_results.results | map(attribute='json') | list }}"

    - name: Transformar todos os hosts (batch)
      ansible.builtin.set_fact:
        all_cloud_data: >-
          {{ all_host_vars | batch_transform_gcp_hosts(
               modelo_servidor_map | default({}),
               gcp_machine_specs   | default({}),
               owner_ids           | default({}),
               cpu_platform_map    | default({})
             ) }}

    - name: "Log - hosts ignorados (GKE + sem ef_cmdb)"
      ansible.builtin.debug:
        msg: "Hosts AAP: {{ all_host_vars | length }} | Elegiveis: {{ all_cloud_data | length }} | Ignorados: {{ all_host_vars | length - all_cloud_data | length }}"

    # -------------------------------------------------------------------------
    # SELECAO DOS SERVIDORES DE TESTE
    # -------------------------------------------------------------------------
    - name: Selecionar por lista de nomes
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data | selectattr('name_cloud', 'in', test_servers) | list }}"
      when: test_servers | length > 0

    - name: Selecionar por limite
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data[:test_limit | int] }}"
      when: test_limit | int > 0 and test_servers | length == 0

    - name: Exibir cloud_data de cada servidor
      ansible.builtin.debug:
        msg: "{{ item | to_nice_yaml }}"
      loop: "{{ selected_servers }}"
      loop_control:
        label: "{{ item.name_cloud }}"

    - name: Parar se dry_run
      ansible.builtin.meta: end_play
      when: dry_run | bool

    # =========================================================================
    # EXECUCAO REAL
    # =========================================================================
    - name: Inicializar logs
      ansible.builtin.set_fact:
        sync_log_create: []
        sync_log_skip: []

    # -------------------------------------------------------------------------
    # CMDB - BUSCA GLOBAL PAGINADA
    #
    # O Jira limita cada resposta a 1000 objetos.
    #
    # Por isso buscamos:
    #
    #   startAt=0
    #   startAt=1000
    #   startAt=2000
    #   ...
    #   startAt=19000
    #
    # Isso permite carregar ate 20.000 objetos do Object Type 121.
    #
    # IMPORTANTE:
    # Nao existe filtro por Datacenter aqui.
    #
    # Para decidir CREATE/SKIP precisamos verificar se o Name existe
    # em QUALQUER servidor do CMDB.
    # -------------------------------------------------------------------------
    - name: Buscar servidores existentes no CMDB - paginado
      ansible.builtin.uri:
        url: "{{ jira_url }}/object/aql?startAt={{ item }}&maxResults=1000"
        method: POST
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        force_basic_auth: yes
        user: "{{ jira_user }}"
        password: "{{ jira_password }}"
        body:
          qlQuery: 'objectTypeId = 121'
        body_format: json
        status_code: [200]
        timeout: 60
      register: cmdb_pages
      environment: "{{ proxy_env | default({}) }}"
      loop: "{{ range(0, 20000, 1000) | list }}"
      loop_control:
        label: "startAt={{ item }}"
      retries: 3
      delay: 5
      until: cmdb_pages.status == 200

    # -------------------------------------------------------------------------
    # CONSOLIDAR AS PAGINAS
    # -------------------------------------------------------------------------
    - name: Inicializar lista de servidores do CMDB
      ansible.builtin.set_fact:
        cmdb_all_servers: []

    - name: Consolidar paginas do CMDB
      ansible.builtin.set_fact:
        cmdb_all_servers: >-
          {{
            cmdb_all_servers
            + (item.json['values'] | default([]))
          }}
      loop: "{{ cmdb_pages.results }}"
      loop_control:
        label: "Pagina com {{ item.json['values'] | default([]) | length }} objetos"

    # -------------------------------------------------------------------------
    # EXTRAIR TODOS OS NAMES
    # -------------------------------------------------------------------------
    - name: Extrair nomes globais do CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: >-
          {{
            cmdb_all_servers
            | map(attribute='label')
            | list
          }}

    - name: Debug - Total de servidores carregados do CMDB
      ansible.builtin.debug:
        msg:
          - "Total de objetos carregados: {{ cmdb_all_servers | length }}"
          - "Total de Names carregados: {{ cmdb_server_names | length }}"

    # -------------------------------------------------------------------------
    # DETERMINAR ACOES
    #
    # Se Name existe em qualquer objeto do CMDB:
    #   -> SKIP
    #
    # Se Name nao existe:
    #   -> CREATE
    # -------------------------------------------------------------------------
    - name: Determinar acoes
      ansible.builtin.set_fact:
        servers_to_create: >-
          {{
            selected_servers
            | rejectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}

        servers_to_skip: >-
          {{
            selected_servers
            | selectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}

    - name: Exibir acoes determinadas
      ansible.builtin.debug:
        msg:
          - "Selecionados: {{ selected_servers | length }}"
          - "A criar: {{ servers_to_create | length }}"
          - "Existentes (skip): {{ servers_to_skip | length }}"
          - "CREATE: {{ servers_to_create | map(attribute='name_cloud') | list }}"
          - "SKIP: {{ servers_to_skip | map(attribute='name_cloud') | list }}"

    # -------------------------------------------------------------------------
    # CREATE
    # -------------------------------------------------------------------------
    - name: Criar servidores
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/integration_assets_gcp/tasks/create.yml"
      vars:
        current_cloud_data: "{{ item }}"
      loop: "{{ servers_to_create }}"
      loop_control:
        label: "{{ item.name_cloud }}"
      when: servers_to_create | length > 0

    # -------------------------------------------------------------------------
    # RESULTADO
    # -------------------------------------------------------------------------
    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                    RESULTADO DO TESTE"
          - "════════════════════════════════════════════════════════════════"
          - "Selecionados: {{ selected_servers | length }}"
          - "Criados: {{ sync_log_create | length }}"
          - "Existentes (skip): {{ servers_to_skip | length }}"
          - "════════════════════════════════════════════════════════════════"