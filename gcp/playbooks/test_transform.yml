# =============================================================================
# Playbook: Testar transformação GCP → cloud_data (dry-run)
# =============================================================================
# Uso:
#   ansible-playbook playbooks/test_transform.yml \
#     -e "@files/sample_gcp_instance.json" \
#     -e "@files/sample_machine_type.json"
#
# Ou com dados inline:
#   ansible-playbook playbooks/test_transform.yml -e "instance_json='{}'"
# =============================================================================
---
- name: Testar transformação GCP → CMDB (dry-run)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Dados de exemplo da VM (do problem statement)
    sample_instance:
      canIpForward: false
      cpuPlatform: "Intel Broadwell"
      creationTimestamp: "2025-06-18T11:25:12.495-07:00"
      deletionProtection: false
      disks:
        - architecture: "X86_64"
          autoDelete: true
          boot: true
          deviceName: "vm-bastion-linux"
          diskSizeGb: "10"
          guestOsFeatures:
            - type: "UEFI_COMPATIBLE"
          index: 0
          licenses:
            - "https://www.googleapis.com/compute/v1/projects/debian-cloud/global/licenses/debian-12-bookworm"
          mode: "READ_WRITE"
          type: "PERSISTENT"
      id: "4281307396103387753"
      labels:
        goog-ops-agent-policy: "v2-x86-template-1-4-0"
      machineType: "https://www.googleapis.com/compute/v1/projects/claro-infracloud/zones/southamerica-east1-c/machineTypes/e2-medium"
      name: "vm-bastion-linux"
      networkInterfaces:
        - accessConfigs:
            - kind: "compute#accessConfig"
              name: "External NAT"
              natIP: "34.39.133.95"
              networkTier: "PREMIUM"
              type: "ONE_TO_ONE_NAT"
          networkIP: "10.80.2.11"
          stackType: "IPV4_ONLY"
      selfLink: "https://www.googleapis.com/compute/v1/projects/claro-infracloud/zones/southamerica-east1-c/instances/vm-bastion-linux"
      status: "RUNNING"
      tags:
        items:
          - "bastion-linux"
          - "jumpserver-infracloud"
      zone: "https://www.googleapis.com/compute/v1/projects/claro-infracloud/zones/southamerica-east1-c"

    sample_machine_type:
      creationTimestamp: "1969-12-31T16:00:00.000-08:00"
      description: "Efficient Instance, 2 vCPU (1/2 shared physical core) and 4 GB RAM"
      guestCpus: 2
      id: "334004"
      isSharedCpu: true
      kind: "compute#machineType"
      maximumPersistentDisks: 128
      maximumPersistentDisksSizeGb: "263168"
      memoryMb: 4096
      name: "e2-medium"
      zone: "southamerica-east1-c"

  tasks:
    - name: "════════════════════════════════════════════════════════════════"
      ansible.builtin.debug:
        msg: "TESTE DE TRANSFORMAÇÃO GCP → CMDB"

    - name: Exibir dados de entrada (instância GCP)
      ansible.builtin.debug:
        msg: "{{ sample_instance | to_nice_yaml }}"
        verbosity: 1

    - name: Transformar instância GCP para cloud_data
      ansible.builtin.set_fact:
        cloud_data: "{{ sample_instance | transform_gcp_instance(sample_machine_type) }}"

    - name: Exibir cloud_data transformado
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          RESULTADO DA TRANSFORMAÇÃO (cloud_data)
          ════════════════════════════════════════════════════════════════
          {{ cloud_data | to_nice_yaml }}

    - name: Incluir variáveis de mapeamento
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/integration_assets/vars/mapeamento_gcp_cmdb.yml"

    - name: Gerar payload para Jira Assets
      ansible.builtin.set_fact:
        jira_payload: "{{ cloud_data | update_asset(object_attribute_map) }}"

    - name: Exibir payload final para Jira Assets
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PAYLOAD PARA JIRA ASSETS API
          ════════════════════════════════════════════════════════════════
          {{ jira_payload | to_nice_json }}

    - name: Validar payload
      ansible.builtin.assert:
        that:
          - jira_payload.objectTypeId == 121
          - jira_payload.attributes | length > 0
        success_msg: "✅ Payload válido com {{ jira_payload.attributes | length }} atributos"
        fail_msg: "❌ Payload inválido"

    - name: Resumo dos atributos mapeados
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                    RESUMO DO MAPEAMENTO"
          - "════════════════════════════════════════════════════════════════"
          - "Name: {{ cloud_data.name_cloud }}"
          - "FQDN: {{ cloud_data.fqdn_cloud }}"
          - "Sistema Operacional: {{ cloud_data.sistema_operacional_cloud }}"
          - "Memória RAM: {{ cloud_data.memoria_ram_cloud }} MB"
          - "CPU Count: {{ cloud_data.cpu_count_cloud }}"
          - "Disco: {{ cloud_data.capacidade_disco_cloud }} GB"
          - "Status: {{ cloud_data.status_cloud }}"
          - "Tipo Servidor: {{ cloud_data.tipo_servidor_cloud }}"
          - "Datacenter: {{ cloud_data.datacenter_cloud }}"
          - "IPs: {{ cloud_data.interface_rede_cloud | map(attribute='ip') | list | join(', ') }}"
          - "════════════════════════════════════════════════════════════════"
