# =============================================================================
# CAMPOS NÃO MAPEÁVEIS VIA GCP (preenchimento manual pelo CMDB)
# =============================================================================
# Os campos abaixo NÃO podem ser preenchidos automaticamente via GCP
# Devem ser mantidos como estão ou preenchidos manualmente:
#
# - Criticidade (id: 3626) - Regra organizacional
# - Sistema (id: 9219) - Labels do GCP ou manual
# - Ambiente (id: 1922) - Labels do GCP (environment) ou manual
# - Owner (id: 3381) - Manual
# - Grupo Solucionador - Infra (id: 7274) - Organizacional
# - Grupo Solucionador - Serviço (id: 9222) - Organizacional
# - Unidade de Negócio (id: 2010) - Labels ou manual
# - Plataformas de Segurança (id: 9522) - Manual
# - VCenter (id: 8742) - Não aplicável para GCP
# - Cluster (id: 3526) - Não existe conceito nativo na GCP
# - Versão Sistema Operacional (id: 3471) - Requer agente instalado
# - File Systems - Requer agente instalado
# - Banco de Dados - Não detectável via API
# - Disaster Recovery - Não detectável via API
# - Chamado de Desativação - Processo ITSM
# - Last User - Não disponível via API
# =============================================================================


