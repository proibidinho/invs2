# =============================================================================
# vars/modelo_servidor_map_gcp.yml
# =============================================================================
# Mapa machine_type (GCP) -> objectKey (GDA-*) do Object Type 406 no CMDB.
# Extraido do dump do CMDB (script acha_atributos.py --list-objects).
#
# Como usar no playbook GCP:
#
#   - name: Transformar hosts GCP
#     ansible.builtin.set_fact:
#       all_cloud_data: "{{ hosts | batch_transform_gcp_hosts(modelo_servidor_map, gcp_machine_specs, owner_ids) }}"
#
# Quando o time CMDB criar um novo machine_type, basta acrescentar a entrada
# correspondente em modelo_servidor_map e, quando aplicavel, em
# gcp_machine_specs.
# NAO precisa mexer no filter Python nem no mapeamento_gcp_cmdb.yml.
# =============================================================================
---

modelo_servidor_map:

  # === C2 (compute optimized) ===
  c2-standard-4:            GDA-3223797

  # === N1 Custom ===
  custom-16-65536-ext:      GDA-3223878
  custom-2-12288:           GDA-3223879
  custom-2-24576-ext:       GDA-3223881
  custom-22-94208-ext:      GDA-3223883
  custom-30-129024-ext:     GDA-3223886
  custom-4-16384-ext:       GDA-3223888
  custom-4-32768-ext:       GDA-3223890
  custom-4-8192-ext:        GDA-3223892

  # === E2 Custom ===
  e2-custom-14-79872:       GDA-3223926
  e2-custom-16-32768:       GDA-3223928
  e2-custom-22-126976:      GDA-3223929
  e2-custom-24-65536:       GDA-3223931

  # === E2 Shared Core ===
  e2-medium:                GDA-3223933
  e2-small:                 GDA-3223935

  # === E2 Standard ===
  e2-standard-16:           GDA-3223938
  e2-standard-2:            GDA-3223940
  e2-standard-4:            GDA-3223941
  e2-standard-8:            GDA-3223943

  # === N1 Shared Core ===
  f1-micro:                 GDA-3223964
  g1-small:                 GDA-3223978

  # === N1 Standard ===
  n1-standard-1:            GDA-3223790
  n1-standard-2:            GDA-3223792
  n1-standard-8:            GDA-3223794

  # === N2 Custom ===
  n2-custom-2-9984:         GDA-3223796
  n2-custom-32-200704:      GDA-3223798

  # === N2 Standard ===
  n2-standard-2:            GDA-3223800


# =============================================================================
# GCP MACHINE SPECS - CPU e Memoria por machine_type
# =============================================================================
# Mapa machine_type (GCP) -> quantidade de CPU e memoria RAM.
#
# Regra esperada em gcp_cmdb_filters.py -> transform_gcp_host:
#
#   machine_type
#       -> gcp_machine_specs[machine_type]
#       -> cpu        -> cpu_count_cloud
#       -> memory_gb  -> memoria_ram_cloud (* 1024 para MB)
#
# O sync NAO deve consultar a API GCP para descobrir CPU ou memoria.
# Estes valores sao mantidos estaticamente, seguindo o mesmo padrao utilizado
# nos projetos AWS e Azure.
# =============================================================================

gcp_machine_specs:

  # === C2 (compute optimized) ===
  c2-standard-4:
    cpu: 4
    memory_gb: 16

  # === N1 Custom ===
  custom-16-65536-ext:
    cpu: 16
    memory_gb: 64

  custom-2-12288:
    cpu: 2
    memory_gb: 12

  custom-2-24576-ext:
    cpu: 2
    memory_gb: 24

  custom-22-94208-ext:
    cpu: 22
    memory_gb: 92

  custom-30-129024-ext:
    cpu: 30
    memory_gb: 126

  custom-4-16384-ext:
    cpu: 4
    memory_gb: 16

  custom-4-32768-ext:
    cpu: 4
    memory_gb: 32

  custom-4-8192-ext:
    cpu: 4
    memory_gb: 8

  # === E2 Custom ===
  e2-custom-14-79872:
    cpu: 14
    memory_gb: 78

  e2-custom-16-32768:
    cpu: 16
    memory_gb: 32

  e2-custom-22-126976:
    cpu: 22
    memory_gb: 124

  e2-custom-24-65536:
    cpu: 24
    memory_gb: 64

  # === E2 Shared Core ===
  e2-medium:
    cpu: 2
    memory_gb: 4

  e2-small:
    cpu: 2
    memory_gb: 2

  e2-micro:
    cpu: 2
    memory_gb: 1

  # === E2 Standard ===
  e2-standard-16:
    cpu: 16
    memory_gb: 64

  e2-standard-2:
    cpu: 2
    memory_gb: 8

  e2-standard-4:
    cpu: 4
    memory_gb: 16

  e2-standard-8:
    cpu: 8
    memory_gb: 32

  # === N1 Shared Core ===
  f1-micro:
    cpu: 1
    memory_gb: 0.6

  g1-small:
    cpu: 1
    memory_gb: 1.7

  # === N1 Standard ===
  n1-standard-1:
    cpu: 1
    memory_gb: 3.75

  n1-standard-2:
    cpu: 2
    memory_gb: 7.5

  n1-standard-8:
    cpu: 8
    memory_gb: 30

  # === N2 Custom ===
  n2-custom-2-9984:
    cpu: 2
    memory_gb: 9.75

  n2-custom-32-200704:
    cpu: 32
    memory_gb: 196

  # === N2 Standard ===
  n2-standard-2:
    cpu: 2
    memory_gb: 8

# =============================================================================
# CPU PLATFORM MAP (Object Type 232 - CPU Reference)
# =============================================================================
# Mapeia host.cpuPlatform (ex.: "Intel Broadwell") -> objectId/objectKey do CMDB.
# PREENCHER com os IDs reais quando disponiveis. Enquanto vazio, CPU Platform
# nao eh enviado (comportamento seguro).
#
# Exemplo de preenchimento (substituir 000000 pelo ID real):
#
# cpu_platform_map:
#   "Intel Broadwell":   "000000"
#   "Intel Skylake":     "000000"
#   "Intel Ice Lake":    "000000"
#   "Intel Cascade Lake": "000000"
#   "AMD Rome":          "000000"
#   "AMD Milan":         "000000"
# =============================================================================
cpu_platform_map: {}

# =============================================================================
# OWNERS - IDs dos usuarios no Object Type 91 (Users) do Jira Assets
# =============================================================================
# Regra aplicada em gcp_cmdb_filters.py -> transform_gcp_host:
#   - Producao + Linux    -> owner_ids.prod_linux    (USR-149372  Luccas Guarnier)
#   - Producao + Windows  -> owner_ids.prod_windows  (USR-146496  Carlos Henrique Barboza)
#   - Nao Producao        -> owner_ids.nao_producao  (vazio, Owner nao enviado)
#
# ef_owner NAO participa desta logica em nenhuma hipotese.
# =============================================================================

owner_ids:
  prod_linux:   "149372"   # USR-149372  Luccas Guarnier
  prod_windows: "146496"   # USR-146496  Carlos Henrique Barboza
  nao_producao: ""         # Vazio -> Owner nao enviado



  