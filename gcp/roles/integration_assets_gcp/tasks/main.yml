# =============================================================================
# Task Principal: Sincronizacao GCP (via AAP) → CMDB
# =============================================================================
---
- name: Incluir variaveis de mapeamento GCP
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/mapeamento_gcp_cmdb.yml"

- name: Incluir modelo_servidor_map / gcp_machine_specs / owner_ids / cpu_platform_map
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/modelo_servidor_map_gcp.yml"

- name: Inicializar logs de sincronizacao
  ansible.builtin.set_fact:
    sync_log_create: []
    sync_log_skip: []
    sync_log_deactivate: []
    sync_log_errors: []

# ---------------------------------------------------------------------------
# FASE 1: Coletar hosts do AAP
# ---------------------------------------------------------------------------
- name: "FASE 1 - Coletar hosts do inventario GCP no AAP"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Buscar hosts do inventario GCP no AAP
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/{{ aap_inventory_id }}/hosts/?page_size=500"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
      Content-Type: "application/json"
    validate_certs: "{{ aap_verify_ssl | default(false) }}"
    return_content: yes
    status_code: [200]
  register: aap_hosts_result
  environment:
    http_proxy: "http://10.29.177.37:8080" #Lapa
    https_proxy: "http://10.29.177.37:8080" #Lapa
    no_proxy: ""

- name: Debug - Total de hosts encontrados
  ansible.builtin.debug:
    msg: "Encontrados {{ aap_hosts_result.json.count }} hosts no inventario GCP"

# Buscar variables de cada host (mesmo padrao Azure)
- name: Buscar variaveis de cada host
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/{{ item.id }}/variable_data/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: "{{ aap_verify_ssl | default(false) }}"
  register: host_vars_results
  loop: "{{ aap_hosts_result.json.results }}"
  loop_control:
    label: "{{ item.name }}"

- name: Consolidar variaveis dos hosts
  ansible.builtin.set_fact:
    all_host_vars: "{{ host_vars_results.results | map(attribute='json') | list }}"

- name: Transformar hosts GCP para formato cloud_data (batch - com skip GKE + ef_cmdb)
  ansible.builtin.set_fact:
    cloud_data_list: >-
      {{ all_host_vars | batch_transform_gcp_hosts(
           modelo_servidor_map | default({}),
           gcp_machine_specs   | default({}),
           owner_ids           | default({}),
           cpu_platform_map    | default({})
         ) }}

- name: Debug - Hosts transformados
  ansible.builtin.debug:
    msg: "{{ cloud_data_list | length }} hosts transformados"

# ---------------------------------------------------------------------------
# FASE 2: Coletar dados do CMDB
# ---------------------------------------------------------------------------
- name: "FASE 2 - Coletar servidores GCP do CMDB"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# Consulta especifica GCP
#
# IMPORTANTE:
# Esta consulta continua filtrada por Datacenter = "Google Cloud".
#
# Ela NAO e utilizada para decidir CREATE/SKIP.
#
# Ela e utilizada para montar cmdb_servers, que posteriormente participa
# exclusivamente da identificacao dos servidores que podem ser DESATIVADOS.
#
# NAO remover o filtro de Datacenter desta consulta.
# ---------------------------------------------------------------------------
- name: Buscar servidores GCP existentes no CMDB
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=1000"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Datacenter = "Google Cloud"'
    status_code: [200]
    timeout: 60
  register: cmdb_servers_result
  environment:
    http_proxy: "http://10.29.177.37:8080" #Lapa
    https_proxy: "http://10.29.177.37:8080" #Lapa
    no_proxy: ""
  retries: 3
  delay: 5
  until: cmdb_servers_result.status == 200

- name: Parsear servidores GCP do CMDB
  ansible.builtin.set_fact:
    cmdb_servers: "{{ cmdb_servers_result.json['values'] | default([]) }}"

- name: Debug - Servidores GCP encontrados no CMDB
  ansible.builtin.debug:
    msg: "Encontrados {{ cmdb_servers | length }} servidores GCP no CMDB"

# ---------------------------------------------------------------------------
# Consulta GLOBAL direcionada para verificacao de Name
#
# Em vez de carregar 20.000+ objetos do CMDB, consultamos somente os Names
# que realmente existem no inventario GCP.
#
# A consulta NAO possui filtro de Datacenter porque o atributo Name precisa
# ser verificado globalmente no Object Type Servidor.
#
# Os Names sao enviados em lotes de 200 para evitar uma AQL excessivamente
# grande. Cada lote retorna no maximo 200 objetos, portanto nao depende da
# paginacao global do CMDB.
#
# Esta lista e usada SOMENTE para CREATE/SKIP.
# A consulta anterior, filtrada por Google Cloud, continua sendo usada para
# DEACTIVATE.
# ---------------------------------------------------------------------------
- name: Extrair Names da cloud para consulta no CMDB
  ansible.builtin.set_fact:
    cloud_server_names: >-
      {{
        cloud_data_list
        | map(attribute='name_cloud')
        | unique
        | list
      }}

- name: Dividir Names em lotes de 200
  ansible.builtin.set_fact:
    cloud_server_name_batches: "{{ cloud_server_names | batch(200) | map('list') | list }}"

- name: Buscar no CMDB somente os Names existentes no AAP
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=200"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Name IN ({{ item | map("to_json") | join(", ") }})'
    status_code: [200]
    timeout: 60
  register: cmdb_name_batches_result
  environment: "{{ proxy_env | default({}) }}"
  loop: "{{ cloud_server_name_batches }}"
  loop_control:
    label: "Lote com {{ item | length }} Names"
  retries: 3
  delay: 5
  until: cmdb_name_batches_result.status == 200
  when: item | length > 0

- name: Inicializar lista de Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: []

- name: Consolidar Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: >-
      {{
        cmdb_server_names
        + (item.json['values'] | default([]) | map(attribute='label') | list)
      }}
  loop: "{{ cmdb_name_batches_result.results | default([]) }}"
  loop_control:
    label: "{{ item.json['values'] | default([]) | length }} Names encontrados"
  when:
    - not (item.skipped | default(false))
    - item.json is defined

- name: Normalizar lista de Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: "{{ cmdb_server_names | unique | list }}"

- name: Debug - Consulta direcionada por Name
  ansible.builtin.debug:
    msg:
      - "Names consultados: {{ cloud_server_names | length }}"
      - "Lotes AQL: {{ cloud_server_name_batches | length }}"
      - "Names ja existentes no CMDB: {{ cmdb_server_names | length }}"

# ---------------------------------------------------------------------------
# ALTERNATIVA FUTURA - NAO ATIVAR SEM VALIDACAO DO TIME DE CMDB
# ---------------------------------------------------------------------------
#
# COMPORTAMENTO ATUAL:
#
#   Se o Name ja existir em QUALQUER servidor do CMDB:
#       -> SKIP
#
# Isso evita:
#
#   "The attribute 'Name' has duplicated values"
#
#
# CASO O TIME DE CMDB DECIDA QUE O INVENTARIO CLOUD DEVE SER A VERDADE:
#
# Nao basta remover a verificacao global.
#
# O comportamento recomendado nesse caso seria:
#
#   1. verificar se Name existe globalmente;
#   2. verificar se pertence ao mesmo Datacenter;
#   3. se existir fora de Google Cloud:
#        trocar temporariamente name_cloud por _gcp_instance_id;
#   4. criar o novo CI;
#   5. posteriormente o time de CMDB realiza a reconciliacao.
#
# Exemplo:
#
#   Name existente:
#       servidor01
#
#   Novo CI GCP:
#       <gcp_instance_id>
#
# O _gcp_instance_id ja existe no cloud_data gerado pelo filtro GCP.
#
# NAO IMPLEMENTADO/ATIVO enquanto nao houver definicao do time de CMDB.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# FASE 3: Comparar
# ---------------------------------------------------------------------------
- name: Extrair nomes das instancias GCP
  ansible.builtin.set_fact:
    gcp_instance_names: "{{ cloud_data_list | map(attribute='name_cloud') | list }}"

- name: Determinar servidores a criar / skip / desativar
  ansible.builtin.set_fact:

    # CREATE:
    # Somente servidores cujo Name NAO existe em nenhum objeto do CMDB.
    servers_to_create: >-
      {{
        cloud_data_list
        | rejectattr('name_cloud', 'in', cmdb_server_names)
        | list
      }}

    # SKIP:
    # Servidores cujo Name ja existe em qualquer objeto do CMDB,
    # independentemente do Datacenter.
    servers_to_skip: >-
      {{
        cloud_data_list
        | selectattr('name_cloud', 'in', cmdb_server_names)
        | list
      }}

    # DEACTIVATE:
    # Continua comparando SOMENTE contra os objetos classificados
    # como Google Cloud.
    servers_to_deactivate: >-
      {{
        cmdb_servers
        | rejectattr('label', 'in', gcp_instance_names)
        | list
      }}

- name: Resumo da comparacao
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    RESUMO DA SINCRONIZACAO"
      - "════════════════════════════════════════════════════════════════"
      - "Total instancias GCP: {{ cloud_data_list | length }}"
      - "Total servidores GCP no CMDB: {{ cmdb_servers | length }}"
      - "Total Names globais no CMDB: {{ cmdb_server_names | length }}"
      - "A CRIAR: {{ servers_to_create | length }}"
      - "EXISTENTES (skip): {{ servers_to_skip | length }}"
      - "A DESATIVAR: {{ servers_to_deactivate | length if enable_deactivation else '(desativado)' }}"
      - "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# FASE 4: Executar sincronizacao
# ---------------------------------------------------------------------------
- name: Criar novos servidores no CMDB
  ansible.builtin.include_tasks: create.yml
  vars:
    current_cloud_data: "{{ server_item }}"
  loop: "{{ servers_to_create }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when:
    - servers_to_create | length > 0
    - sync_mode == 'full' or sync_mode == 'create'

- name: Registrar servidores existentes (skip)
  ansible.builtin.set_fact:
    sync_log_skip: "{{ sync_log_skip + [server_item.name_cloud] }}"
  loop: "{{ servers_to_skip }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when: servers_to_skip | length > 0

- name: Desativar servidores removidos do GCP
  ansible.builtin.include_tasks: deactivate.yml
  vars:
    server_to_deactivate: "{{ server_item }}"
  loop: "{{ servers_to_deactivate }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.label }}"
  when:
    - servers_to_deactivate | length > 0
    - sync_mode == 'full' or sync_mode == 'deactivate'
    - enable_deactivation | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 5: Relatorio final
# ---------------------------------------------------------------------------
- name: Relatorio final
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    SINCRONIZACAO CONCLUIDA"
      - "════════════════════════════════════════════════════════════════"
      - "Servidores criados: {{ sync_log_create | length }}"
      - "{{ sync_log_create | join(', ') if sync_log_create else '(nenhum)' }}"
      - "Servidores existentes (skip): {{ sync_log_skip | length }}"
      - "Servidores desativados: {{ sync_log_deactivate | length }}"
      - "════════════════════════════════════════════════════════════════"