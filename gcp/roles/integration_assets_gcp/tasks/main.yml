# =============================================================================
# Task Principal: Sincronizacao GCP (via AAP) -> CMDB
# =============================================================================
# GCP usa /variable_data/ por host porque o filtro Python foi construido
# para receber o dict cru de variaveis (diferente de AWS/Azure).
# =============================================================================
---
- name: Incluir variaveis de mapeamento GCP
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/mapeamento_gcp_cmdb.yml"

- name: Incluir modelo_servidor_map / gcp_machine_specs / owner_ids / cpu_platform_map
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/modelo_servidor_map_gcp.yml"

- name: Inicializar logs de sincronizacao
  ansible.builtin.set_fact:
    sync_log_create: []
    sync_log_skip: []
    sync_log_deactivate: []
    sync_log_errors: []

# ---------------------------------------------------------------------------
# FASE 1: Coletar hosts do AAP (paginado)
# ---------------------------------------------------------------------------
- name: "FASE 1 - Coletar hosts do inventario GCP no AAP (paginado)"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Coletar todos os hosts (paginacao real)
  ansible.builtin.include_tasks: fetch_all_hosts.yml

# ---------------------------------------------------------------------------
# FASE 1.5: Buscar variables de cada host (padrao GCP)
# ---------------------------------------------------------------------------
- name: Buscar variaveis de cada host (com retry)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/{{ item.id }}/variable_data/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: "{{ aap_verify_ssl | default(false) }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: host_vars_results
  retries: 3
  delay: 3
  until: host_vars_results.status == 200
  loop: "{{ aap_all_hosts }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Consolidar variaveis dos hosts (apenas OK)
  ansible.builtin.set_fact:
    all_host_vars: >-
      {{ host_vars_results.results
         | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 200)
         | map(attribute='json')
         | list }}

- name: Registrar hosts com falha na leitura de variables
  ansible.builtin.set_fact:
    sync_log_errors: >-
      {{ sync_log_errors + [{
           'name': item.item.name,
           'status': item.status | default('unknown'),
           'msg': 'falha ao buscar variable_data'
         }] }}
  loop: "{{ host_vars_results.results | rejectattr('status', 'equalto', 200) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: host_vars_results.results | rejectattr('status', 'equalto', 200) | list | length > 0

- name: Transformar hosts GCP para formato cloud_data (batch - com skip GKE + ef_cmdb)
  ansible.builtin.set_fact:
    cloud_data_list: >-
      {{ all_host_vars | batch_transform_gcp_hosts(
           modelo_servidor_map | default({}),
           gcp_machine_specs   | default({}),
           owner_ids           | default({}),
           cpu_platform_map    | default({})
         ) }}

- name: Debug - Hosts transformados
  ansible.builtin.debug:
    msg: "{{ aap_all_hosts | length }} hosts coletados | {{ all_host_vars | length }} com variables | {{ cloud_data_list | length }} elegiveis"

# ---------------------------------------------------------------------------
# FASE 2: Coletar dados do CMDB
# ---------------------------------------------------------------------------
- name: "FASE 2 - Coletar servidores GCP do CMDB"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Buscar servidores GCP existentes no CMDB
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=1000"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Datacenter = "Google Cloud"'
    status_code: [200]
    timeout: 60
  register: cmdb_servers_result
  environment: "{{ proxy_env | default({}) }}"
  retries: 3
  delay: 5
  until: cmdb_servers_result.status == 200

- name: Parsear servidores do CMDB
  ansible.builtin.set_fact:
    cmdb_servers: "{{ cmdb_servers_result.json['values'] | default([]) }}"
    cmdb_server_names: "{{ cmdb_servers_result.json['values'] | default([]) | map(attribute='label') | list }}"

- name: Debug - Servidores encontrados no CMDB
  ansible.builtin.debug:
    msg: "Encontrados {{ cmdb_servers | length }} servidores GCP no CMDB"

# ---------------------------------------------------------------------------
# FASE 3: Comparar
# ---------------------------------------------------------------------------
- name: Extrair nomes das instancias GCP
  ansible.builtin.set_fact:
    gcp_instance_names: "{{ cloud_data_list | map(attribute='name_cloud') | list }}"

- name: Determinar acoes
  ansible.builtin.set_fact:
    servers_to_create:     "{{ cloud_data_list | rejectattr('name_cloud', 'in', cmdb_server_names) | list }}"
    servers_to_skip:       "{{ cloud_data_list | selectattr('name_cloud', 'in', cmdb_server_names) | list }}"
    servers_to_deactivate: "{{ cmdb_servers | rejectattr('label', 'in', gcp_instance_names) | list }}"

- name: Resumo da comparacao
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    RESUMO DA SINCRONIZACAO"
      - "════════════════════════════════════════════════════════════════"
      - "Total instancias GCP: {{ cloud_data_list | length }}"
      - "Total servidores CMDB: {{ cmdb_servers | length }}"
      - "A CRIAR: {{ servers_to_create | length }}"
      - "EXISTENTES (skip): {{ servers_to_skip | length }}"
      - "A DESATIVAR: {{ servers_to_deactivate | length if enable_deactivation else '(desativado)' }}"
      - "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# DRY RUN
# ---------------------------------------------------------------------------
- name: "DRY RUN - encerrar antes de escrever no CMDB"
  ansible.builtin.meta: end_play
  when: dry_run | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 4: Executar sincronizacao
# ---------------------------------------------------------------------------
- name: Criar novos servidores no CMDB
  ansible.builtin.include_tasks: create.yml
  vars:
    current_cloud_data: "{{ server_item }}"
  loop: "{{ servers_to_create }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_create | length > 0
    - sync_mode == 'full' or sync_mode == 'create'

- name: Registrar servidores existentes (skip)
  ansible.builtin.set_fact:
    sync_log_skip: "{{ sync_log_skip + [server_item.name_cloud] }}"
  loop: "{{ servers_to_skip }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when: servers_to_skip | length > 0

- name: Desativar servidores removidos do GCP
  ansible.builtin.include_tasks: deactivate.yml
  vars:
    server_to_deactivate: "{{ server_item }}"
  loop: "{{ servers_to_deactivate }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.label }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_deactivate | length > 0
    - sync_mode == 'full' or sync_mode == 'deactivate'
    - enable_deactivation | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 5: Relatorio final
# ---------------------------------------------------------------------------
- name: "FASE 5 - Relatorio final"
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    SINCRONIZACAO CONCLUIDA"
      - "════════════════════════════════════════════════════════════════"
      - "Criados com sucesso: {{ sync_log_create | length }}"
      - "Ignorados (ja existentes): {{ sync_log_skip | length }}"
      - "Desativados: {{ sync_log_deactivate | length }}"
      - "ERROS: {{ sync_log_errors | length }}"
      - "────────────────────────────────────────────────────────────────"
      - "{% for e in sync_log_errors %}- {{ e.name }} | status={{ e.status }} | {{ e.msg }}\n{% endfor %}"
      - "════════════════════════════════════════════════════════════════"

- name: Falhar apenas se TODOS falharam
  ansible.builtin.fail:
    msg: "Sincronizacao falhou: TODOS os {{ servers_to_create | length }} servidores tiveram erro"
  when:
    - servers_to_create | length > 0
    - sync_log_create | length == 0
    - sync_log_errors | length >= servers_to_create | length