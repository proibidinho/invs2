# =============================================================================
# Task: Criar objeto no Jira Assets
# =============================================================================
---
- name: Inicializar lista de IDs de interface de rede
  ansible.builtin.set_fact:
    interface_rede_ids: []

- name: Verificar/Criar Interface de Rede (se necessário)
  ansible.builtin.include_tasks: manage_network_interface.yml
  loop: "{{ current_cloud_data.interface_rede_cloud | default([]) }}"
  loop_control:
    loop_var: ip_info
  when:
  - current_cloud_data.interface_rede_cloud is defined
  - current_cloud_data.interface_rede_cloud | length > 0

# ---------------------------------------------------------------------------
# CPU: Buscar ou Criar objeto CPU no Jira Assets (ANTES do payload)
# ---------------------------------------------------------------------------
- name: Inicializar cpu_object_id
  ansible.builtin.set_fact:
    cpu_object_id: null

- name: Buscar CPU existente pelo nome
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql"
    method: POST
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: "objectTypeId = {{ objectTypeId_cpu }} AND Name = \"{{ current_cloud_data.cpu_platform_cloud }}\""
      resultPerPage: 1
    body_format: json
    return_content: yes
    status_code: [ 200 ]
  register: cpu_search_result
  environment: "{{ proxy_env | default({}) }}"
  when:
  - current_cloud_data.cpu_platform_cloud is defined
  - current_cloud_data.cpu_platform_cloud | length > 0

- name: Verificar se CPU foi encontrada
  ansible.builtin.set_fact:
    cpu_found: "{{ (cpu_search_result.json['values'] | default([])) | length > 0 }}"
  when: cpu_search_result is defined and cpu_search_result.json is defined

- name: Extrair ID da CPU (se existir)
  ansible.builtin.set_fact:
    cpu_object_id: "{{ cpu_search_result.json['values'][0]['id'] }}"
  when:
  - cpu_found is defined and cpu_found

- name: Criar novo objeto CPU
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/create"
    method: POST
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      objectTypeId: "{{ objectTypeId_cpu }}"
      attributes:
      - objectTypeAttributeId: "{{ cpu_name_attribute_id }}"
        objectAttributeValues:
        - value: "{{ current_cloud_data.cpu_platform_cloud }}"
    body_format: json
    return_content: yes
    status_code: [ 200, 201 ]
  register: cpu_create_result
  environment: "{{ proxy_env | default({}) }}"
  when:
  - cpu_found is defined
  - not cpu_found
  - current_cloud_data.cpu_platform_cloud is defined
  - current_cloud_data.cpu_platform_cloud | length > 0

- name: Definir ID da CPU criada
  ansible.builtin.set_fact:
    cpu_object_id: "{{ cpu_create_result.json.id }}"
  when:
  - cpu_found is defined
  - not cpu_found
  - cpu_create_result is defined
  - cpu_create_result.json is defined

- name: Debug - CPU
  ansible.builtin.debug:
    msg: "CPU '{{ current_cloud_data.cpu_platform_cloud }}': {{ 'Existente' if cpu_found else 'Criada' }} (ID: {{ cpu_object_id }})"
  when:
  - cpu_found is defined
  - current_cloud_data.cpu_platform_cloud is defined
  - current_cloud_data.cpu_platform_cloud | length > 0

# ---------------------------------------------------------------------------
# Payload
# ---------------------------------------------------------------------------

- name: Gerar payload base para criacao
  ansible.builtin.set_fact:
    data_create: "{{ current_cloud_data | update_asset_gcp(object_attribute_map) }}"

- name: Adicionar Interface de Rede ao payload
  ansible.builtin.set_fact:
    data_create: >-
      {{ data_create | combine({
           'attributes': data_create.attributes + [{
             'objectTypeAttributeId': '3528',
             'objectAttributeValues': interface_rede_ids | map('regex_replace', '^(.*)$', '{"value": "\1"}') | map('from_json') | list
           }]
         })
      }}
  when: interface_rede_ids | length > 0

- name: Adicionar CPU ao payload
  ansible.builtin.set_fact:
    data_create: >-
      {{ data_create | combine({
           'attributes': data_create.attributes + [{
             'objectTypeAttributeId': '3527',
             'objectAttributeValues': [{'value': cpu_object_id | string}]
           }]
         })
      }}
  when: cpu_object_id is defined and cpu_object_id

- name: DEBUG - Payload final de criação
  ansible.builtin.debug:
    msg: "{{ data_create | to_json }}"

- name: Criar objeto no Assets
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/create"
    method: POST
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body: "{{ data_create | to_json }}"
    body_format: json
    return_content: yes
    status_code: [ 200, 201 ]
  register: resultado_create
  environment: "{{ proxy_env | default({}) }}"

- name: Debug - Resultado da criação
  ansible.builtin.debug:
    msg: "Servidor '{{ current_cloud_data.name_cloud }}' criado com sucesso. ID: {{ resultado_create.json.id | default('N/A') }}"

- name: Registrar criação no log
  ansible.builtin.set_fact:
    sync_log_create: "{{ sync_log_create | default([]) + [current_cloud_data.name_cloud] }}"
