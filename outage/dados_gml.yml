        "customfield_31914": {
          "type": "doc",
          "version": 1,
          "content": [
            {
              "type": "paragraph",
              "content": [
                {
                  "type": "text",
                  "text": "1. Contexto de negócio — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " objetivo claro de migração para Powerscale visando alta disponibilidade e inovação."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "2. Escopo técnico — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " ICs BRWIN0291 e 2K12RJOFS04 mapeados e coerentes com a descrição da migração."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "3. Impacto — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " indisponibilidade de acesso aos dados declarada e coerente com a migração de file servers."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "4. Risco — MEDIO:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " migração de servidores de armazenamento com indisponibilidade, mitigado por histórico positivo de atividades nos ICs."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "5. Plano de execução — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " passo a passo lógico detalhado, incluindo backup, unjoin/join de domínio e configurações de DNS/Powerscale."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "6. Plano de validação — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " critério funcional de validação de dados migrados definido, proporcional à complexidade média."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "7. Plano de rollback — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " procedimento detalhado e autocontido com comandos específicos (isi network/auth) e reversão de DNS/AD."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "8. Governança — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " owners técnico (Marcos Alves Canhete) e de negócio (Silvia Maria Salmeron Navarro Pereira) nominais."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "9. Dependências externas — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " envolvimento da equipe Dell e suporte de infraestrutura mapeados nas atividades RDM."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "10. Janela e timing — OK:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " janela de 8 horas definida em período noturno/fim de semana, adequada para o impacto declarado."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "11. Histórico de similares — HISTORICO_POSITIVO:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " 100% de sucesso nas 3 mudanças anteriores identificadas para o servidor BRWIN0291."
                }
              ]
            }
          ]
        },
        "customfield_31917": null,
        "customfield_31916": {
          "type": "doc",
          "version": 1,
          "content": [
            {
              "type": "paragraph",
              "content": [
                {
                  "type": "text",
                  "text": "A mudança apresenta um plano técnico robusto e detalhado, com atividades RDM vinculadas que cobrem todas as frentes necessárias (Windows, Redes, Storage e Backup). O plano de rollback é técnico e autocontido, atendendo às diretrizes de Infraestrutura, e o histórico de sucesso nos ICs afetados reforça a confiança na execução."
                }
              ]
            }
          ]
        },
