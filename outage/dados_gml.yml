        "description": {
          "type": "doc",
          "version": 1,
          "content": [
            {
              "type": "paragraph",
              "content": [
                {
                  "type": "text",
                  "text": "Objetivo:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Realizar a migração dos servidores BRWIN0291 e 2K12RJOFS04 para a solução Powerscale da Dell. Tratam-se de servidores de armazenamento de dados de usuários Claro."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Unidade de négócio:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Consumo Pessoal"
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Criticidade da mudança:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Média"
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "ICs afetados:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": "  brwin0291"
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Qual benefício a execução da atividade trará?",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Inovação tecnológica com garantia de alta disponibilidade dos dados relacionados aos file servers."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Validação funcional:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": "  Validar os dados que foram migrados dos servidores para a plataforma Powerscale da Dell."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Plano de retorno:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " # Remover o SmartConnectZone do IP PoolDell isi network pool modify groupnet0.subnet-dados.pool-(BRWIN0291 e 2K12RJOFS04--sc-dns-zone) \" - (Equipe Dell)"
                }
              ]
            },
            {
              "type": "orderedList",
              "attrs": {
                "order": 1
              },
              "content": [
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Apagar os SPNs no cluster \"brpscale002\"Dell isi auth ads spn delete CORP.CLAROBR HOST/(BRWIN0291.corp.clarobr/ 2K12RJOFS04."
                        },
                        {
                          "type": "text",
                          "text": "nt.embratel.com.br",
                          "marks": [
                            {
                              "type": "underline"
                            },
                            {
                              "type": "link",
                              "attrs": {
                                "href": "http://nt.embratel.com.br/"
                              }
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": ") isi auth ads spn delete CORP.CLAROBR HOST/(BRWIN0291/2K12RJOFS04)- (Equipe Dell)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Apagar entradas DNSRede Zona Delegada: \"(BRWIN0291.corp.clarobr/2K12RJOFS04."
                        },
                        {
                          "type": "text",
                          "text": "nt.embratel.com.br",
                          "marks": [
                            {
                              "type": "underline"
                            },
                            {
                              "type": "link",
                              "attrs": {
                                "href": "http://nt.embratel.com.br/"
                              }
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": ") \" - (Suporte Redes)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Fazer unjoin dos servidores \" por exemplo \"BRWIN0291-old.corp.clarobr\" / \"2K12RJOFS04-old."
                        },
                        {
                          "type": "text",
                          "text": "nt.embratel.com.br",
                          "marks": [
                            {
                              "type": "underline"
                            },
                            {
                              "type": "link",
                              "attrs": {
                                "href": "http://nt.embratel.com.br/"
                              }
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": "\" do AD - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Reconfigurar os servidores com o IP originais - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Voltar os hostnames dos servidores - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Fazer o join dos servidores antigos no AD - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Criar entradas DNS antigas (Suporte Rede)"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Testes realizados:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " Realizada a POC do servidor Figueirópolis com sucesso para a plataforma Powerscale da Dell. Realizada a migração dos servidores CBL1CM68919 e CBL1CM46223 com sucesso."
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Impacto negócio:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " "
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Impacto de não fazer:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " Mantermos o parque tecnológico desfasado e sem alta disponibilidade dos dados dos file servers."
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Data do início da mudança:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " 19/09/2026 22:00"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Data do fim da mudança:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " 20/09/2026 06:00"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Gerência:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " SERGIO DOBON DIAZ"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "Diretoria:",
                          "marks": [
                            {
                              "type": "strong"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " LUCIANO LUNA"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        },
