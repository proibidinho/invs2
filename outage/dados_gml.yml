              "customfield_16056": { "type": "doc", "version": 1, "content": [ { "type": "paragraph", "content": [ { "type": "text", "text": "Adequação STW - Rede Neutra - Mudança de Pacote e Complementos", "marks": [ { "type": "strong" } ] }, { "type": "hardBreak" }, { "type": "text", "text": "Benefício:", "marks": [ { "type": "strong" } ] }, { "type": "text", "text": " Atender as funcionalidades de mudança de pacote up/down grade, e vendas em  contratos rede neutra com complementos com espaço ou acento." }, { "type": "hardBreak" }, { "type": "text", "text": "Objetivo:", "marks": [ { "type": "strong" } ] }, { "type": "text", "text": " Adequar o processamento dos eventos de rede neutra 32 e 35 no STW para os ajustes abaixo:" } ] }, { "type": "paragraph", "content": [ { "type": "text", "text": "Ajuste na identificação da velocidade atual de internet do contrato, em uma solicitação de mudança de pacote (up/dow grade), para enviar corretamente a mudança de velocidade para o parceiro de rede neutra (VTAL)." } ] }, { "type": "paragraph", "content": [ { "type": "text", "text": "Ajuste na identificação dos tipos de complementos que possuem espaço no campo texto do complemento e tipos de complementos que possuem assento, exemplo:" } ] }, { "type": "paragraph", "content": [ { "type": "text", "text": "TIPO COMPLEMENTO: CASA / TEXTO COMPLEMENTO: FRETE PREDIO" } ] }, { "type": "paragraph", "content": [ { "type": "text", "text": "TIPO COMPLEMENTO: CHÁCARA / TEXTO COMPLEMENTO: BOA VISTA" } ] }, { "type": "paragraph", "content": [ { "type": "text", "text": "LT:", "marks": [ { "type": "strong" }, { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "text", "text": " Andre Luiz Gil da Silva", "marks": [ { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "hardBreak" }, { "type": "text", "text": "Validação técnica:", "marks": [ { "type": "strong" }, { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "text", "text": " Validar o aprovisionamento e processamento das filas de eventos no STW com sucesso. -Responsável: Andre Luiz Gil da Silva", "marks": [ { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "hardBreak" }, { "type": "text", "text": "Validação funcional:", "marks": [ { "type": "strong" }, { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "text", "text": " Validar o aprovisionamento e processamento das filas de eventos no STW com sucesso. -Responsável: Andre Luiz Gil da Silva", "marks": [ { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "hardBreak" }, { "type": "text", "text": "Plano de retorno:", "marks": [ { "type": "strong" }, { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "text", "text": " Anexo", "marks": [ { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "hardBreak" }, { "type": "text", "text": "Testes realizados:", "marks": [ { "type": "strong" }, { "type": "textColor", "attrs": { "color": "#ff0000" } } ] }, { "type": "text", "text": " Mudança de pacote em contrato rede neutra VTAL - up e down grade.Consulta de endereço e viabilidade em endereço rede neutra VTAL com complemento com espaço no texto e com acento.", "marks": [ { "type": "textColor", "attrs": { "color": "#ff0000" } } ] } ] } ] },
