                      }
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Validar os dados que foram migrados do servidor para a plataforma Powerscale da Dell. -Responsável: Marcos Alves Canhete",
                  "marks": [
                    {
                      "type": "textColor",
                      "attrs": {
                        "color": "#ff0000"
                      }
                    }
                  ]
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Plano de retorno:",
                  "marks": [
                    {
                      "type": "strong"
                    },
                    {
                      "type": "textColor",
                      "attrs": {
                        "color": "#ff0000"
                      }
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " # Remover o SmartConnectZone do IP PoolDell isi network pool modify groupnet0.subnet-dados.pool-(BRWIN0291 --sc-dns-zone) \" - (Equipe Dell)# Apagar os SPNs no cluster \"brpscale002\"Dell isi auth ads spn delete CORP.CLAROBR HOST/(BRWIN0291.corp.clarobr) isi auth ads spn delete CORP.CLAROBR HOST/(BRWIN0291)- (Equipe Dell)# Apagar entradas DNSRede Zona Delegada: \"(BRWIN0291.corp.clarobr) \" - (Suporte Redes)# Fazer unjoin dos servidores \" por exemplo \"BRWIN0291-old.corp.clarobr\" do AD - (Suporte Windows)# Reconfigurar os servidores com o IP originais - (Suporte Windows)# Voltar os hostnames dos servidores - (Suporte Windows)# Fazer o join dos servidores antigos no AD - (Suporte Windows)# Criar entradas DNS antigas (Suporte Rede)",
