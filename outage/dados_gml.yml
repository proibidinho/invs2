                  "marks": [
                    {
                      "type": "textColor",
                      "attrs": {
                        "color": "#ff0000"
                      }
                    }
                  ]
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Validação técnica:",
                  "marks": [
                    {
                      "type": "strong"
                    },
                    {
                      "type": "textColor",
                      "attrs": {
                        "color": "#ff0000"
                      }
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Validar os dados que foram migrados do servidor para a plataforma Powerscale da Dell. -Responsável: Marcos Alves Canhete",
                  "marks": [
                    {
                      "type": "textColor",
                      "attrs": {
                        "color": "#ff0000"
                      }
                    }
                  ]
                },
                {
                  "type": "hardBreak"
