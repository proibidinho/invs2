              "content": [
                {
                  "type": "text",
                  "text": "Projeto Global File Server - Migração do Servidor BRWIN0291 para o Powerscale",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Benefício:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Inovação tecnológica com garantia de alta disponibilidade dos dados relacionados aos file servers."
                },
                {
                  "type": "hardBreak"
                },
                {
                  "type": "text",
                  "text": "Objetivo:",
                  "marks": [
                    {
                      "type": "strong"
                    }
                  ]
                },
                {
                  "type": "text",
                  "text": " Realizar a migração do servidor BRWIN0291 para a solução Powerscale da Dell. Tratam-se de servidores de armazenamento de dados de usuários Claro."
                }
              ]
            },
            {
              "type": "paragraph",
              "content": [
                {
                  "type": "text",
                  "text": "LT:",
