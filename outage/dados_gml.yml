        "customfield_14098": null,
        "customfield_14099": {
          "type": "doc",
          "version": 1,
          "content": [
            {
              "type": "orderedList",
              "attrs": {
                "order": 1
              },
              "content": [
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Fazer backup da estrutura dos compartilhamentos - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Parar os compartilhamentos via \"Computer Management\" - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Executar os jobs incrementais e analisar os logs gerados - (Equipe Dell)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Fazer o unjoin dos servidores BRWIN0291 do domínio - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Remover entrada DNS BRWIN0291.corp.clarobr e/ou "
                        },
                        {
                          "type": "text",
                          "text": "Site oficial da Claro operadora - Com Fibra, 5G e muito mais!",
                          "marks": [
                            {
                              "type": "link",
                              "attrs": {
                                "href": "http://claro.com.br/"
                              }
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": "  e/ou "
                        },
                        {
                          "type": "text",
                          "text": "nt.embratel.com.br",
                          "marks": [
                            {
                              "type": "link",
                              "attrs": {
                                "href": "http://nt.embratel.com.br/"
                              }
                            },
                            {
                              "type": "underline"
                            }
                          ]
                        },
                        {
                          "type": "text",
                          "text": " - (Suporte Redes)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Criar entradas DNS - (Suporte Redes)"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "a.\tZona Delegada: \" BRWIN0291.corp.clarobr\" --> NS (sip-brpscale001.corp.clarobr) e NS (sip-brpscale002.corp.clarobr)"
                        },
                        {
                          "type": "hardBreak"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Alterar o IP Pool configurando o SmartConnectZone nos dois clusters - (Equipe Dell)"
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "a.\tCluster \"brpscale001\""
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "isi network pool modify groupnet0.subnet-dados.pool-BRWIN0291--sc-dns-zone \"BRWIN0291.corp.clarobr\""
                        },
                        {
                          "type": "hardBreak"
                        }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "b.\tCluster \"brpscale002\""
                        },
                        {
                          "type": "hardBreak"
                        },
                        {
                          "type": "text",
                          "text": "isi network pool modify groupnet0.subnet-dados.pool-BRWIN0291 --sc-dns-zone \"igls-original-BRWIN0291.corp.clarobr\""
                        },
                        {
                          "type": "hardBreak"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Confirmar que o FQDNs configurados estão resolvendo para o range de IPs corretos - (Equipe Dell)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Criar os SPNs nos dois clusters PowerScale - (Equipe Dell)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "isi auth ads spn fix CORP.CLAROBR"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "isi auth ads spn list CORP.CLAROBR | grep -i (listar os servidores)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Iniciar testes de acesso - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Fazer join do server original no AD utilizando outro nome, por exemplo \"BRWIN0291-old.corp.clarobr\"  - (Suporte Windows)"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "listItem",
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        {
                          "type": "text",
                          "text": "Criar entrada DNS do tipo A para o FQDN \"BRWIN0291-old.corp.clarobr\"  - (Suporte Redes)"
                        }
                      ]
                    }
                  ]
                }
              ]
            },
            {
              "type": "paragraph"
            }
          ]
        },
