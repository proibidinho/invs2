# =============================================================================
# Task Principal: Sincronizacao AWS (via AAP) -> CMDB
# =============================================================================
---
- name: Incluir variaveis de mapeamento AWS
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/mapeamento_aws_cmdb.yml"

- name: Inicializar logs de sincronizacao
  ansible.builtin.set_fact:
    sync_log_create: []
    sync_log_skip: []
    sync_log_deactivate: []
    sync_log_errors: []

# ---------------------------------------------------------------------------
# FASE 1: Coletar hosts do AAP (paginado)
# ---------------------------------------------------------------------------
- name: "FASE 1 - Coletar hosts do inventario AWS no AAP (paginado)"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Coletar todos os hosts (paginacao real)
  ansible.builtin.include_tasks: fetch_all_hosts.yml

- name: Transformar hosts AWS para formato cloud_data (batch - com skip EKS + ef_cmdb)
  ansible.builtin.set_fact:
    cloud_data_list: >-
      {{ aap_all_hosts | batch_transform_aws_hosts(
           modelo_servidor_map | default({}),
           aws_vm_specs        | default({}),
           owner_ids           | default({})
         ) }}

- name: Debug - Hosts transformados
  ansible.builtin.debug:
    msg: "{{ aap_all_hosts | length }} hosts coletados | {{ cloud_data_list | length }} elegiveis | {{ aap_all_hosts | length - cloud_data_list | length }} ignorados"

# ---------------------------------------------------------------------------
# FASE 2: Coletar dados do CMDB
# ---------------------------------------------------------------------------
- name: "FASE 2 - Coletar servidores AWS do CMDB"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Buscar servidores AWS existentes no CMDB
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=1000"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Datacenter = "AWS"'
    status_code: [200]
    timeout: 60
  register: cmdb_servers_result
  environment: "{{ proxy_env | default({}) }}"
  retries: 3
  delay: 5
  until: cmdb_servers_result.status == 200

- name: Parsear servidores do CMDB
  ansible.builtin.set_fact:
    cmdb_servers: "{{ cmdb_servers_result.json['values'] | default([]) }}"
    cmdb_server_names: "{{ cmdb_servers_result.json['values'] | default([]) | map(attribute='label') | list }}"

- name: Debug - Servidores encontrados no CMDB
  ansible.builtin.debug:
    msg: "Encontrados {{ cmdb_servers | length }} servidores AWS no CMDB"

# ---------------------------------------------------------------------------
# FASE 3: Comparar
# ---------------------------------------------------------------------------
- name: Extrair nomes das instancias AWS
  ansible.builtin.set_fact:
    aws_instance_names: "{{ cloud_data_list | map(attribute='name_cloud') | list }}"

- name: Determinar acoes
  ansible.builtin.set_fact:
    servers_to_create:     "{{ cloud_data_list | rejectattr('name_cloud', 'in', cmdb_server_names) | list }}"
    servers_to_skip:       "{{ cloud_data_list | selectattr('name_cloud', 'in', cmdb_server_names) | list }}"
    servers_to_deactivate: "{{ cmdb_servers | rejectattr('label', 'in', aws_instance_names) | list }}"

- name: Resumo da comparacao
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    RESUMO DA SINCRONIZACAO"
      - "════════════════════════════════════════════════════════════════"
      - "Total instancias AWS: {{ cloud_data_list | length }}"
      - "Total servidores CMDB: {{ cmdb_servers | length }}"
      - "A CRIAR: {{ servers_to_create | length }}"
      - "EXISTENTES (skip): {{ servers_to_skip | length }}"
      - "A DESATIVAR: {{ servers_to_deactivate | length if enable_deactivation else '(desativado)' }}"
      - "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# DRY RUN - encerrar aqui
# ---------------------------------------------------------------------------
- name: "DRY RUN - encerrar antes de escrever no CMDB"
  ansible.builtin.meta: end_play
  when: dry_run | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 4: Executar sincronizacao
# ---------------------------------------------------------------------------
- name: "FASE 4 - Executar sincronizacao"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Criar novos servidores no CMDB
  ansible.builtin.include_tasks: create.yml
  vars:
    current_cloud_data: "{{ server_item }}"
  loop: "{{ servers_to_create }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_create | length > 0
    - sync_mode == 'full' or sync_mode == 'create'

- name: Registrar servidores existentes (skip)
  ansible.builtin.set_fact:
    sync_log_skip: "{{ sync_log_skip + [server_item.name_cloud] }}"
  loop: "{{ servers_to_skip }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when: servers_to_skip | length > 0

- name: Desativar servidores removidos da AWS
  ansible.builtin.include_tasks: deactivate.yml
  vars:
    server_to_deactivate: "{{ server_item }}"
  loop: "{{ servers_to_deactivate }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.label }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_deactivate | length > 0
    - sync_mode == 'full' or sync_mode == 'deactivate'
    - enable_deactivation | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 5: Relatorio final
# ---------------------------------------------------------------------------
- name: "FASE 5 - Relatorio final"
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    SINCRONIZACAO CONCLUIDA"
      - "════════════════════════════════════════════════════════════════"
      - "Criados com sucesso: {{ sync_log_create | length }}"
      - "Ignorados (ja existentes): {{ sync_log_skip | length }}"
      - "Desativados: {{ sync_log_deactivate | length }}"
      - "ERROS: {{ sync_log_errors | length }}"
      - "────────────────────────────────────────────────────────────────"
      - "{% for e in sync_log_errors %}- {{ e.name }} | status={{ e.status }} | {{ e.msg }}\n{% endfor %}"
      - "════════════════════════════════════════════════════════════════"

- name: Falhar apenas se TODOS falharam
  ansible.builtin.fail:
    msg: "Sincronizacao falhou: TODOS os {{ servers_to_create | length }} servidores tiveram erro"
  when:
    - servers_to_create | length > 0
    - sync_log_create | length == 0
    - sync_log_errors | length == servers_to_create | length