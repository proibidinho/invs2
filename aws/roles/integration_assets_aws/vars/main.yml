# =============================================================================
# VARIAVEIS PRINCIPAIS - CONFIGURACAO AWS
# =============================================================================
---
# Jira Assets
workspace: "76827f8b-4d96-46a6-abf2-f592d6b4b2d9"
jira_url: "https://api.atlassian.com/jsm/insight/workspace/{{ workspace }}/v1"
jira_user: "{{ lookup('env', 'JIRA_USER') }}"
jira_password: "{{ lookup('env', 'JIRA_PASSWORD') }}"

# Object Type IDs
object_type_id_servidor: 121
object_type_id_interface_rede: 230
object_type_id_datacenter: 152

# Attribute IDs para criacao de objetos
nic_name_attribute_id: "1890"
dc_name_attribute_id: "1339"

# AAP - Inventory Azure
aap_host: "https://aap.claro.com.br"
aap_inventory_id: "92"
aap_verify_ssl: false
aap_token: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  31616266343830623035393835633434393766613663333636343734376563366233636562303466
  6334623763623662313637393433653263656331303165340a623166306566373631366530303763
  34363562616234366465313430623730643633653632343632383335626361313362363331303866
  3966366637333730610a363037373736343965383533313837653566653731653332333932393631
  66633366643539623963613662316539346666363965376462323032303764623930

# Modo de sincronizacao: full, create, update, deactivate
sync_mode: "full"
enable_deactivation: false

# Proxy Lapa
proxy_env:
  http_proxy: "http://10.29.177.37:8080" #Lapa
  https_proxy: "http://10.29.177.37:8080" #Lapa
  no_proxy: ""

# =============================================================================
# CREDENCIAIS AWS (via AAP - credential type "Amazon Web Services")
# =============================================================================
# O credential AAP injeta automaticamente no ambiente do job:
AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
#   AWS_SECURITY_TOKEN         (quando aplicavel)
# A CLI 'aws' consome esses envs sem configuracao adicional. So precisamos
# informar a regiao default (list de instance-types nao muda entre regioes,
# mas o CLI exige regiao configurada). Trocar aqui se necessario.
aws_default_region: "us-east-1"

# =============================================================================
# OWNER - IDs dos usuarios no Object Type 91 (Users) do Jira Assets
# =============================================================================
# Regra aplicada pelo filter determine_owner(so, ambiente, owner_ids):
#   - Producao + Linux    -> owner_ids.prod_linux    (Luccas Guarnier)
#   - Producao + Windows  -> owner_ids.prod_windows  (Carlos Henrique Barboza)
#   - Nao Producao        -> owner_ids.nao_producao  (Bernardo - TEMPORARIO)
# Basta trocar o ID abaixo quando o objeto correto do Bernardo for criado.
owner_ids:
  prod_linux:   "149372"    # USR-149372  Luccas Guarnier
  prod_windows: "146496"    # USR-146496  Carlos Henrique Barboza
  nao_producao: "1497044"   # USR-1497044 Leonardo (TEMPORARIO - trocar p/ Bernardo)